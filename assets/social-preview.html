<!doctype html>
<!-- Source of social-preview.png (1280×640), the image GitHub, LinkedIn and chat apps show for
     a link to the repository or the documentation page. Render it with
     `node scripts/render-assets.mjs`, or in CI with the "assets" workflow. Same layout as the
     other projects' previews. Fonts are the kit's own, so nothing is fetched. -->
<html><head><meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter Variable";
    font-weight: 100 900;
    src: url("../fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
  }
  html,body{margin:0;width:1280px;height:640px;background:#050505;font-family:"Inter Variable",sans-serif;color:#f2f4f5}
  .wrap{display:flex;align-items:center;gap:64px;height:100%;padding:0 96px;box-sizing:border-box}
  img{width:300px;height:300px}
  h1{font-size:96px;font-weight:800;margin:0;letter-spacing:-.03em}
  p{font-size:38px;font-weight:500;margin:18px 0 0;color:#c9cdd2;line-height:1.3}
  .k{margin-top:34px;font-size:24px;color:#10cf53;font-weight:700;letter-spacing:.04em}
</style></head><body><div class="wrap">
  <img src="logo.svg" alt="">
  <div>
    <h1>nava-ui</h1>
    <p>A small, dark-first UI kit<br>in plain CSS. Tokens, components,<br>two themes, no build step.</p>
    <div class="k">CSS · DESIGN TOKENS · ACCESSIBLE · APACHE-2.0</div>
  </div>
</div></body></html>
