name: assets

# Renders the images that come from HTML sources (scripts/render-assets.mjs) in the same
# Playwright image as the tests, and uploads them as the "assets" artifact. Download it and
# commit the files: gh run download <run-id> -n assets -D assets
on:
  # On any branch, when a source changes: the artifact is ready before the change is merged.
  push:
    paths:
      - assets/*.html
      - assets/logo.svg
      - scripts/render-assets.mjs
      - .github/workflows/assets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: node scripts/render-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets/social-preview.png
