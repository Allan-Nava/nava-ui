name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the screenshot baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    name: contrast and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contrast of every text and background pair, both themes
        run: node scripts/contrast.mjs
      - name: dist/ is in sync with css/ and js/
        run: |
          ./scripts/build.sh
          git diff --exit-code -- dist/

  browser:
    name: screenshots and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Compare with the baselines
        if: ${{ !inputs.update_snapshots }}
        run: npx playwright test

      - name: Regenerate the baselines
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test --update-snapshots

      - name: Upload the new baselines
        if: ${{ always() && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/__screenshots__/

      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
