name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the screenshot baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    name: contrast and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contrast of every text and background pair, both themes
        run: node scripts/contrast.mjs
      # Starts checking as soon as ROADMAP.md exists (generate it with `npx backlogsync roadmap`).
      - name: Backlog is valid and ROADMAP.md is up to date
        if: ${{ hashFiles('ROADMAP.md') != '' }}
        uses: Allan-Nava/backlogsync@backlogsync--v0.1.1
        with:
          command: check
      - name: dist/ is in sync with css/ and js/
        run: |
          ./scripts/build.sh
          git diff --exit-code -- dist/

  browser:
    name: screenshots and accessibility
    runs-on: ubuntu-latest
    # The official image already holds the browser and its system libraries, so
    # the job does not depend on the apt mirrors. The tag must be the version
    # of @playwright/test in package.json: change the two together.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci

      - name: Compare with the baselines
        if: ${{ !inputs.update_snapshots }}
        run: npx playwright test

      - name: Regenerate the baselines
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test --update-snapshots

      - name: Upload the new baselines
        if: ${{ always() && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/__screenshots__/

      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
