name: site drift

# The kit and allan-nava.github.io share their tokens by copy. Until the site
# reads them from the kit, this compares the two every week and fails when a
# value differs, so the copy cannot age unnoticed.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared tokens have the same values
        run: node scripts/site-drift.mjs
      # Stricter: every token the site declares, fluid type sizes and fonts included, must
      # come out of the export with the same value.
      - name: The export reproduces the site's tokens
        run: node scripts/export-site.mjs --check https://raw.githubusercontent.com/Allan-Nava/Allan-Nava.github.io/master/_sass/base/tokens.scss
