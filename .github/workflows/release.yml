name: release

# A pushed tag vX.Y.Z is a release. This checks that the files at the tag agree
# with it, builds dist/ and compares it with what is committed, then creates
# the GitHub release with the changelog section as notes and the dist/ files
# attached. The CDN serves the tag already: the release is the page people
# read, and the place the files can be downloaded from.
#
# Run it by hand with an existing tag to create or refresh that tag's release.
# The tooling comes from the commit the workflow runs on; the files checked
# come from the tag, so an old tag can be released with today's checks.
#
# npm: the second job publishes @allan_nava/nava-ui and @allan_nava/nava-ui-react (NV-23) through npm
# trusted publishing (OIDC), with provenance and no token; it skips a version
# that is already on npm, so a re-run is safe.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create or refresh the release for, such as v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Tooling
        uses: actions/checkout@v4
        with:
          path: tools
      - name: The tagged files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: tagged
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The tag, VERSION, package.json, the CDN URLs and the changelog agree
        id: check
        run: node tools/scripts/release-check.mjs "$TAG" --dir tagged --notes release-notes.md

      - name: dist/ at the tag is what its sources build
        working-directory: tagged
        run: |
          npm ci
          ./scripts/build.sh
          git diff --exit-code -- dist/ css/tokens.css

      - name: Create or refresh the GitHub release
        working-directory: tagged
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          # Only the highest version is "latest": releasing an old tag by hand
          # must not move the badge back.
          HIGHEST="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          LATEST=false
          [ "$TAG" = "$HIGHEST" ] && LATEST=true
          FILES="dist/nava-ui.css dist/nava-ui.components.css dist/nava-ui.js dist/nava-ui.min.css dist/nava-ui.components.min.css dist/nava-ui.min.js dist/tokens.dark.json dist/tokens.light.json dist/tailwind.css dist/tailwind.preset.cjs"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "nava-ui $VERSION" --notes-file ../release-notes.md --latest="$LATEST"
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --verify-tag --title "nava-ui $VERSION" \
              --notes-file ../release-notes.md --latest="$LATEST"
          fi
          echo "Release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

  npm:
    # The same publishing job as claimcheck and backlogsync, which publish this way: npm
    # trusted publishing (OIDC), no token. Each package's page on npmjs.com names this
    # repository and this workflow file as its trusted publisher. DO NOT RENAME THIS FILE: the
    # publish would stop authenticating, with an error that does not mention the filename.
    #
    # BOOTSTRAP: npm forbids a trusted publisher for a package that does not exist, so the
    # first version goes out either by hand (`npm publish --access public`) or with a granular
    # token in the NPM_TOKEN secret, which this job uses when it is set. Delete the secret once
    # both trusted publishers are configured. The job skips a version already on the registry,
    # so a rerun, or a release after a publish by hand, is safe.
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # OIDC: this is what authenticates the publish
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # No `registry-url`. With it setup-node writes an .npmrc holding
      # `_authToken=${NODE_AUTH_TOKEN}`; npm then finds a credential configured for the
      # registry, never performs the OIDC exchange, publishes with the placeholder, and npm
      # answers 404. registry.npmjs.org is npm's default anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Trusted publishing needs npm >= 11.5.1. Pinned on purpose: a moving npm in the
      # publishing path can break a release on its own. Bump it deliberately.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@11.19.0
          npm --version
      # --ignore-scripts: no dependency lifecycle script runs beside the publishing
      # privilege. The React package's own build runs below, from its prepack.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Publish @allan_nava/nava-ui and @allan_nava/nava-ui-react, unless already on npm
        env:
          VERSION: ${{ needs.release.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Nothing authenticates this publish but OIDC — unless the bootstrap token is set.
          unset NODE_AUTH_TOKEN
          if [ -n "$NPM_TOKEN" ]; then
            echo "::warning::Publishing with the NPM_TOKEN secret (bootstrap). Configure the trusted publishers on npmjs.com, then delete the secret."
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "::notice::$name@$VERSION is already on the registry — skipping publish"
              return 0
            fi
            # Verbose on purpose: a refused OIDC exchange otherwise ends in a bare ENEEDAUTH;
            # at verbose npm prints the exchange and why it failed. Provenance comes with
            # trusted publishing; with the bootstrap token it is asked for explicitly.
            (cd "$1" && npm publish --access public --provenance --loglevel verbose)
            echo "Published $name@$VERSION" >> "$GITHUB_STEP_SUMMARY"
          }
          publish .
          publish packages/react
      # The registry takes a moment to serve a freshly published version (over a minute
      # has been seen): twenty tries at 15 seconds.
      - name: Verify the published versions
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          for name in @allan_nava/nava-ui @allan_nava/nava-ui-react; do
            ok=
            for i in $(seq 1 20); do
              if [ "$(npm view "$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
                echo "$name@$VERSION is live after $i tries"; ok=1; break
              fi
              echo "$name: not visible yet, retrying…"; sleep 15
            done
            [ -n "$ok" ] || { echo "::error::$name@$VERSION did not appear on the registry"; exit 1; }
          done
