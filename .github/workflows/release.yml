name: release

# A pushed tag vX.Y.Z is a release. This checks that the files at the tag agree
# with it, builds dist/ and compares it with what is committed, then creates
# the GitHub release with the changelog section as notes and the dist/ files
# attached. The CDN serves the tag already: the release is the page people
# read, and the place the files can be downloaded from.
#
# Run it by hand with an existing tag to create or refresh that tag's release.
# The tooling comes from the commit the workflow runs on; the files checked
# come from the tag, so an old tag can be released with today's checks.
#
# npm: the second job publishes nava-ui and @nava-ui/react (NV-23) through npm
# trusted publishing (OIDC), with provenance and no token; it skips a version
# that is already on npm, so a re-run is safe.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create or refresh the release for, such as v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Tooling
        uses: actions/checkout@v4
        with:
          path: tools
      - name: The tagged files
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: tagged
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The tag, VERSION, package.json, the CDN URLs and the changelog agree
        id: check
        run: node tools/scripts/release-check.mjs "$TAG" --dir tagged --notes release-notes.md

      - name: dist/ at the tag is what its sources build
        working-directory: tagged
        run: |
          npm ci
          ./scripts/build.sh
          git diff --exit-code -- dist/ css/tokens.css

      - name: Create or refresh the GitHub release
        working-directory: tagged
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          # Only the highest version is "latest": releasing an old tag by hand
          # must not move the badge back.
          HIGHEST="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          LATEST=false
          [ "$TAG" = "$HIGHEST" ] && LATEST=true
          FILES="dist/nava-ui.css dist/nava-ui.components.css dist/nava-ui.js dist/nava-ui.min.css dist/nava-ui.components.min.css dist/nava-ui.min.js dist/tokens.dark.json dist/tokens.light.json dist/tailwind.css dist/tailwind.preset.cjs"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "nava-ui $VERSION" --notes-file ../release-notes.md --latest="$LATEST"
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --verify-tag --title "nava-ui $VERSION" \
              --notes-file ../release-notes.md --latest="$LATEST"
          fi
          echo "Release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

  npm:
    # Trusted publishing (OIDC): no npm token anywhere. Each package's page on npmjs.com names
    # this repository and this workflow file as its trusted publisher, so DO NOT RENAME THIS
    # FILE without changing that too. The first version of each package is published by hand
    # (npm cannot trust a publisher for a package that does not exist yet): see CLAUDE.md.
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC: this is what authenticates the publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # No `registry-url`: with it, setup-node writes an .npmrc holding a token placeholder,
      # npm then counts a credential as configured and never does the OIDC exchange (the lesson
      # of qrspi's first release). registry.npmjs.org is npm's default anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm >= 11.5.1, and Node 22 bundles npm 10. Pinned: a moving
      # npm in the publishing path can break a release on its own.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@11.19.0
          npm --version
      - run: npm ci
      - name: Publish nava-ui and @nava-ui/react, unless the version is already on npm
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
            else
              (cd "$1" && npm publish --provenance --access public)
              echo "Published $name@$VERSION" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          publish .
          publish packages/react
